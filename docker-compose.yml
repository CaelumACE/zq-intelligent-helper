
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gov123456}
      POSTGRES_DB: gov_assistant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gov -d gov_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    # 不直接向宿主机/公网暴露后端端口，统一经 nginx 反代访问
    expose:
      - "8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-minimax}
      - LLM_FALLBACK_PROVIDER=${LLM_FALLBACK_PROVIDER:-deepseek}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_MODEL=${MINIMAX_MODEL:-MiniMax-Text-01}
      - MINIMAX_BASE_URL=${MINIMAX_BASE_URL:-https://api.minimax.chat/v1}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRE_HOURS=${JWT_EXPIRE_HOURS:-72}
      - ALLOW_MULTI_SESSION=${ALLOW_MULTI_SESSION:-false}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-180}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME:-super_admin}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-}
      - DEMO_ENABLED=${DEMO_ENABLED:-0}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-}
      - DATABASE_URL=postgresql+psycopg2://gov:${POSTGRES_PASSWORD:-gov123456}@postgres:5432/gov_assistant
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-minimax}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-embo-01}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1536}
      - RERANK_PROVIDER=${RERANK_PROVIDER:-offline}
      - RERANK_MODEL=${RERANK_MODEL:-n-gram-offline}
      - RERANK_BASE_URL=${RERANK_BASE_URL:-}
      - RERANK_API_KEY=${RERANK_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-2}
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
