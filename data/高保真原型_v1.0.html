<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>政企智能助手 · 高保真原型 v1.1</title>
<style>
  :root{
    --primary:#1A3A6B; --primary-strong:#12304F; --primary-soft:#EAF0F8;
    --gold:#C8A45A; --gold-strong:#B08E42; --gold-soft:#F5EDDA;
    --navy:#12304F;
    --bg:#F5F6F9; --surface:#FFFFFF; --border:#E6E9EF;
    --text-1:#1A2433; --text-2:#56627A; --text-3:#8A94A6;
    --success:#1E9E6A; --warning:#D98A1F; --danger:#D64545;
    --font:"PingFang SC","Microsoft YaHei","Source Han Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --r-sm:4px; --r-md:6px; --r-lg:10px;
    --shadow-sm:0 1px 2px rgba(18,48,79,.06);
    --shadow-md:0 4px 16px rgba(18,48,79,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text-1);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
  .app{display:flex;height:100vh}

  /* ===== 侧边栏 ===== */
  .sidebar{width:260px;background:var(--navy);color:#C7D2E0;display:flex;flex-direction:column;flex-shrink:0}
  .side-head{padding:20px 18px 14px}
  .logo{display:flex;align-items:center;gap:10px}
  .logo .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--gold-strong));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;box-shadow:0 2px 6px rgba(200,164,90,.4)}
  .logo span{color:#fff;font-weight:600;font-size:15px;letter-spacing:.5px}
  .new-btn{margin:14px 18px 12px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:var(--r-md);background:var(--gold);color:#3A2F14;font-weight:600;font-size:14px;cursor:pointer;transition:background .15s}
  .new-btn:hover{background:var(--gold-strong);color:#fff}
  .conv-wrap{flex:1;overflow-y:auto;padding:0 12px 12px}
  .conv-group{margin-top:14px}
  .conv-group .g-title{font-size:11px;color:#7E93AF;padding:0 10px 6px;letter-spacing:.06em}
  .conv-item{position:relative;padding:10px 30px 10px 12px;border-radius:var(--r-md);font-size:13px;color:#B9C8DC;cursor:pointer;transition:background .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv-item:hover{background:rgba(255,255,255,.07);color:#fff}
  .conv-item.active{background:var(--primary);color:#fff}
  .conv-item .del{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.18);display:none;align-items:center;justify-content:center;font-size:11px;color:#fff}
  .conv-item:hover .del{display:flex}
  .side-foot{padding:14px 20px;font-size:12px;color:#7E93AF;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:8px}

  /* ===== 主对话区 ===== */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  .topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:14px;flex-shrink:0}
  .topbar .t-title{font-size:15px;font-weight:600;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .t-actions{margin-left:auto;display:flex;gap:8px}
  .icon-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:all .15s}
  .icon-btn:hover{border-color:var(--gold);color:var(--gold-strong)}

  .chat-stream{flex:1;overflow-y:auto;padding:28px 0}
  .chat-inner{max-width:820px;margin:0 auto;padding:0 24px}
  .welcome-empty{text-align:center;padding:40px 10px 10px}
  .welcome-empty .big{font-size:20px;font-weight:600;color:var(--navy);margin-bottom:8px}
  .welcome-empty .sub{font-size:14px;color:var(--text-3);margin-bottom:34px}
  .suggest-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;max-width:760px;margin:0 auto;text-align:left}
  .suggest-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;cursor:pointer;transition:all .16s}
  .suggest-card:hover{border-color:var(--gold);box-shadow:var(--shadow-md);transform:translateY(-2px)}
  .suggest-card .ic{font-size:20px;margin-bottom:8px}
  .suggest-card .q{font-size:14px;color:var(--text-1);font-weight:500}
  .suggest-card .tag{font-size:11px;color:var(--gold-strong);margin-top:6px}

  .msg{display:flex;gap:12px;margin-bottom:22px}
  .msg .ava{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;margin-top:2px}
  .msg.user .ava{background:var(--navy);color:#fff}
  .msg.ai .ava{background:linear-gradient(135deg,var(--gold),var(--gold-strong));color:#fff}
  .msg .body{flex:1;min-width:0}
  .msg.user .body{display:flex;justify-content:flex-end}
  .msg .bubble{max-width:88%;padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.75}
  .msg.user .bubble{background:var(--primary);color:#fff;border-top-right-radius:4px}
  .msg.ai .bubble{background:var(--surface);border:1px solid var(--border);border-top-left-radius:4px;box-shadow:var(--shadow-sm)}
  .cite{font-size:11px;color:var(--gold-strong);background:var(--gold-soft);border-radius:4px;padding:0 5px;margin:0 2px;vertical-align:super;cursor:pointer;font-weight:600}
  .src-pop{border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:6px;padding:10px 14px;background:#FBF9F4;margin-top:10px;font-size:12px}
  .src-pop .st{font-weight:600;color:var(--primary);margin-bottom:4px}
  .src-pop .sb{color:var(--text-2);line-height:1.7}
  .src-pop mark{background:#FFF3C9;padding:0 2px;border-radius:2px}
  .refs{margin-top:12px;border-top:1px dashed var(--border);padding-top:10px}
  .refs.toogle .ref-head{font-size:12px;color:var(--text-3);cursor:pointer;display:flex;align-items:center;gap:6px}
  .refs .ref-body{margin-top:8px;display:none}
  .refs.open .ref-body{display:block}
  .ref-item{font-size:12px;color:var(--text-2);padding:6px 0;border-bottom:1px solid var(--border)}
  .ref-item:last-child{border-bottom:none}
  .ref-item b{color:var(--primary)}
  .msg-actions{display:flex;gap:10px;margin-top:10px}
  .mini-btn{font-size:12px;color:var(--text-2);border:1px solid var(--border);background:var(--surface);border-radius:16px;padding:3px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s}
  .mini-btn:hover{border-color:var(--gold);color:var(--gold-strong)}

  /* 流程导引卡片 */
  .guide-card{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;box-shadow:var(--shadow-sm)}
  .guide-card .g-head{background:var(--primary);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px}
  .guide-card .g-head .ic{font-size:18px}
  .guide-card .g-head b{font-size:15px}
  .guide-card .g-body{padding:16px 18px}
  .guide-card .g-sec{margin-bottom:14px}
  .guide-card .g-sec:last-child{margin-bottom:0}
  .guide-card .g-sec h5{font-size:13px;color:var(--primary);margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .guide-card ol{padding-left:20px;font-size:13px;color:var(--text-2)}
  .guide-card ol li{margin-bottom:5px}
  .mat-list{display:flex;flex-wrap:wrap;gap:8px}
  .mat-chip{font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:4px 12px;color:var(--text-2)}
  .guide-meta{display:flex;gap:20px;font-size:12px;color:var(--text-3)}

  /* 公文写作面板 */
  .doc-panel{position:absolute;top:56px;right:0;bottom:0;width:420px;max-width:90%;background:var(--surface);border-left:1px solid var(--border);box-shadow:-8px 0 24px rgba(18,48,79,.12);transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;z-index:20}
  .doc-panel.open{transform:translateX(0)}
  .doc-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .doc-head h3{font-size:15px;font-weight:600}
  .doc-head .close{cursor:pointer;font-size:18px;color:var(--text-3)}
  .doc-tabs{display:flex;padding:12px 16px 0;gap:8px}
  .doc-tab{flex:1;text-align:center;padding:8px 4px;font-size:13px;color:var(--text-2);border-bottom:2px solid transparent;cursor:pointer}
  .doc-tab.active{color:var(--primary);border-bottom-color:var(--gold);font-weight:600}
  .doc-form{padding:16px 20px;overflow-y:auto;flex:1}
  .doc-form .field{margin-bottom:14px}
  .doc-form label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px}
  .doc-form label .req{color:var(--danger)}
  .doc-form input,.doc-form textarea,.doc-form select{width:100%;font-family:var(--font);font-size:13px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-md);transition:border .15s}
  .doc-form textarea{min-height:80px;resize:vertical;line-height:1.7}
  .doc-form input:focus,.doc-form textarea:focus,.doc-form select:focus{outline:none;border-color:var(--gold)}
  .gen-btn{width:100%;padding:11px;border:none;border-radius:var(--r-md);background:var(--primary);color:#fff;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;transition:background .15s}
  .gen-btn:hover{background:var(--primary-strong)}
  .doc-result{margin-top:16px;border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:6px;padding:14px 16px;background:#FBF9F4;font-size:13px;line-height:1.8;display:none}
  .doc-result.show{display:block}

  .chat-input{background:var(--surface);border-top:1px solid var(--border);padding:14px 24px;flex-shrink:0}
  .chat-input .input-row{max-width:820px;margin:0 auto;display:flex;gap:12px;align-items:flex-end}
  .chat-input textarea{flex:1;font-family:var(--font);font-size:14px;padding:11px 14px;border:1px solid var(--border);border-radius:var(--r-lg);resize:none;height:50px;line-height:1.6}
  .chat-input textarea:focus{outline:none;border-color:var(--gold)}
  .send-btn{font-family:var(--font);font-size:14px;font-weight:600;padding:12px 24px;border:none;border-radius:var(--r-lg);background:var(--primary);color:#fff;cursor:pointer;transition:background .15s}
  .send-btn:hover{background:var(--primary-strong)}
  .input-hint{max-width:820px;margin:8px auto 0;font-size:12px;color:var(--text-3);text-align:center}

  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
  @media(max-width:760px){.sidebar{display:none}.doc-panel{width:100%}}
  @media print{.sidebar,.chat-input,.doc-panel{display:none !important}.app{display:block}}
</style>
</head>
<body>
<h1 class="sr-only">政企智能助手 · 政务智能问答与公文写作平台</h1>
<div class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="side-head">
      <div class="logo"><div class="mark">政</div><span>政企智能助手</span></div>
    </div>
    <div class="new-btn" onclick="newChat()">＋ 新建对话</div>
    <div class="conv-wrap" id="convWrap">
      <div class="conv-group">
        <div class="g-title">今天</div>
        <div class="conv-item active" data-title="社保缴费比例咨询" onclick="openConv(this)">社保缴费比例咨询<span class="del" onclick="delConv(event,this)">✕</span></div>
        <div class="conv-item" data-title="关于数字化转型的请示" onclick="openConv(this)">关于数字化转型的请示<span class="del" onclick="delConv(event,this)">✕</span></div>
      </div>
      <div class="conv-group">
        <div class="g-title">昨天</div>
        <div class="conv-item" data-title="营业执照办理流程" onclick="openConv(this)">营业执照办理流程<span class="del" onclick="delConv(event,this)">✕</span></div>
        <div class="conv-item" data-title="会议纪要写作" onclick="openConv(this)">会议纪要写作<span class="del" onclick="delConv(event,this)">✕</span></div>
      </div>
      <div class="conv-group">
        <div class="g-title">更早</div>
        <div class="conv-item" data-title="公积金提取指南" onclick="openConv(this)">公积金提取指南<span class="del" onclick="delConv(event,this)">✕</span></div>
      </div>
    </div>
    <div class="side-foot">👤 演示模式 · 无需登录</div>
  </aside>

  <!-- 主对话区 -->
  <div class="main">
    <header class="topbar">
      <div class="t-title" id="convTitle">新对话</div>
      <div class="t-actions">
        <div class="icon-btn" title="公文写作" onclick="openDoc()">✍️</div>
        <div class="icon-btn" title="帮助">❓</div>
      </div>
    </header>

    <div class="chat-stream" id="chatStream">
      <div class="chat-inner" id="chatInner">
        <!-- 空状态：欢迎 + 推荐问题 -->
        <div class="welcome-empty" id="welcomeEmpty">
          <div class="big">您好，我是政企智能助手 👋</div>
          <div class="sub">政策问答 · 公文写作 · 办事流程导引，一个入口全搞定</div>
          <div class="suggest-grid">
            <div class="suggest-card" onclick="ask('最新社保缴费比例是多少？')"><div class="ic">📚</div><div class="q">最新社保缴费比例是多少？</div><div class="tag">政策问答</div></div>
            <div class="suggest-card" onclick="ask('帮我写一份会议通知')"><div class="ic">✍️</div><div class="q">帮我写一份会议通知</div><div class="tag">公文写作</div></div>
            <div class="suggest-card" onclick="ask('营业执照怎么办理？')"><div class="ic">🧭</div><div class="q">营业执照怎么办理？</div><div class="tag">流程导引</div></div>
            <div class="suggest-card" onclick="ask('介绍一下我们的数字化转型工作请示怎么写')"><div class="ic">📝</div><div class="q">请示类公文有哪些格式要求？</div><div class="tag">公文写作</div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="chat-input">
      <div class="input-row">
        <textarea id="chatInput" placeholder="输入您的问题，Enter 发送，Shift+Enter 换行…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
        <button class="send-btn" onclick="send()">发送</button>
      </div>
      <div class="input-hint">内容由 AI 生成，请以官方文件为准 · 演示原型</div>
    </div>

    <!-- 公文写作面板 -->
    <div class="doc-panel" id="docPanel">
      <div class="doc-head"><h3>✍️ 公文写作助手</h3><span class="close" onclick="closeDoc()">✕</span></div>
      <div class="doc-tabs">
        <div class="doc-tab active" data-type="通知" onclick="switchType(this)">通知</div>
        <div class="doc-tab" data-type="纪要" onclick="switchType(this)">纪要</div>
        <div class="doc-tab" data-type="报告" onclick="switchType(this)">报告</div>
        <div class="doc-tab" data-type="请示" onclick="switchType(this)">请示</div>
      </div>
      <div class="doc-form">
        <div class="field"><label>标题<span class="req"> *</span></label><input id="docTitle" placeholder="如：关于召开2026年度工作会议的通知"></div>
        <div class="field"><label>主送单位</label><input id="docTo" placeholder="如：机关各处室、各直属单位"></div>
        <div class="field"><label>正文要点<span class="req"> *</span></label><textarea id="docBody" placeholder="输入会议时间、地点、参会人员、会议内容等要点…"></textarea></div>
        <div class="field"><label>落款单位 / 日期</label><input id="docSign" placeholder="如：办公室 · 2026年8月22日"></div>
        <button class="gen-btn" onclick="generateDoc()">生成初稿</button>
        <div class="doc-result" id="docResult"></div>
      </div>
    </div>
  </div>
</div>

<script>
  function newChat(){
    document.getElementById('chatInner').innerHTML='<div class="welcome-empty" id="welcomeEmpty"><div class="big">您好，我是政企智能助手 👋</div><div class="sub">政策问答 · 公文写作 · 办事流程导引，一个入口全搞定</div><div class="suggest-grid">'+
    '<div class="suggest-card" onclick="ask(\'最新社保缴费比例是多少？\')"><div class="ic">📚</div><div class="q">最新社保缴费比例是多少？</div><div class="tag">政策问答</div></div>'+
    '<div class="suggest-card" onclick="ask(\'帮我写一份会议通知\')"><div class="ic">✍️</div><div class="q">帮我写一份会议通知</div><div class="tag">公文写作</div></div>'+
    '<div class="suggest-card" onclick="ask(\'营业执照怎么办理？\')"><div class="ic">🧭</div><div class="q">营业执照怎么办理？</div><div class="tag">流程导引</div></div>'+
    '<div class="suggest-card" onclick="ask(\'请示类公文有哪些格式要求？\')"><div class="ic">📝</div><div class="q">请示类公文有哪些格式要求？</div><div class="tag">公文写作</div></div>'+
    '</div></div>';
    document.getElementById('convTitle').textContent='新对话';
    document.querySelectorAll('.conv-item').forEach(function(c){c.classList.remove('active')});
  }
  function openConv(el){
    document.querySelectorAll('.conv-item').forEach(function(c){c.classList.remove('active')});
    el.classList.add('active');
    document.getElementById('convTitle').textContent=el.getAttribute('data-title');
    document.getElementById('welcomeEmpty') && document.getElementById('welcomeEmpty').remove();
  }
  function delConv(e,el){e.stopPropagation();el.closest('.conv-item').remove();}
  function toggleSrc(el){var p=el.closest('.bubble').querySelector('.src-pop');if(!p)return;p.style.display=(p.style.display==='none')?'block':'none';}
  function toggleRefs(el){el.closest('.refs').classList.toggle('open');el.querySelector('span:last-child').textContent=el.closest('.refs').classList.contains('open')?'▴ 收起':'▾ 展开';}
  function copyText(el){var t=el.closest('.bubble');if(navigator.clipboard){navigator.clipboard.writeText(t.innerText);}el.textContent='✓ 已复制';setTimeout(function(){el.textContent='📋 复制';},1200);}
  function regenerate(el){var st=document.getElementById('chatStream');var n=document.createElement('div');n.className='msg ai';n.innerHTML='<div class="ava">AI</div><div class="body"><div class="bubble">已为您重新生成回答（演示）。实际接入模型后此处返回新版本结果。</div></div>';st.insertBefore(n,st.lastChild);}

  function ask(q){document.getElementById('chatInput').value=q;send();}
  function send(){
    var input=document.getElementById('chatInput');var text=input.value.trim();if(!text)return;
    var we=document.getElementById('welcomeEmpty');if(we)we.remove();
    var stream=document.getElementById('chatStream');var inner=document.getElementById('chatInner');
    var u=document.createElement('div');u.className='msg user';u.innerHTML='<div class="ava">我</div><div class="body"><div class="bubble"></div></div>';
    u.querySelector('.bubble').textContent=text;inner.appendChild(u);input.value='';
    var a=document.createElement('div');a.className='msg ai';a.innerHTML='<div class="ava">AI</div><div class="body"><div class="bubble">正在思考…</div></div>';
    inner.appendChild(a);
    setTimeout(function(){a.innerHTML=genReply(text);stream.scrollTop=stream.scrollHeight;},450);
    stream.scrollTop=stream.scrollHeight;
    if(document.getElementById('convTitle').textContent==='新对话'&&text){document.getElementById('convTitle').textContent=text.slice(0,16);}
  }

  function genReply(text){
    var html='<div class="ava">AI</div><div class="body"><div class="bubble">';
    if(/社保|公积金|医保|政策|缴费|比例/.test(text)){
      html+='根据现行政策规定，城镇职工基本养老保险单位缴费比例为16%、个人为8%；医疗保险单位约8-10%、个人2%；失业保险单位0.5%、个人0.5%<cite onclick="toggleSrc(this)">1</cite><cite onclick="toggleSrc(this)">2</cite>。各地执行比例可能存在差异，建议以当地人社部门最新文件为准。<div class="src-pop" style="display:none"><div class="st">[1]《国务院办公厅关于印发降低社会保险费率综合方案的通知》</div><div class="sb">…单位缴费比例高于16%的省份，可<mark>降至16%</mark>…</div></div>';
      html+='<div class="refs toogle"><div class="ref-head" onclick="toggleRefs(this)">📎 参考来源 <span>▾ 展开</span></div><div class="ref-body"><div class="ref-item"><b>降低社会保险费率综合方案</b>（国办发〔2019〕13号）</div><div class="ref-item"><b>社会保险法</b> · 第十二条</div></div></div></div><div class="msg-actions"><span class="mini-btn" onclick="copyText(this)">📋 复制</span><span class="mini-btn" onclick="regenerate(this)">🔄 重新生成</span></div>';
    }else if(/通知|纪要|报告|请示|公文|会议通知|写作/.test(text)){
      html+='您好，这里是<b>公文写作助手</b>的快捷入口。点击右上角 ✍️ 图标，选择公文类型并填写要点，即可一键生成格式规范的初稿。需要我现在帮您打开写作面板吗？<div class="msg-actions"><span class="mini-btn" onclick="openDoc()">✍️ 打开公文写作</span></div>';
    }else if(/办理|流程|营业执照|户口|迁移|手续/.test(text)){
      html+='已为您查询到该事项的办理指南：</div></div></div>';
      html='<div class="ava">AI</div><div class="body"><div class="guide-card"><div class="g-head"><span class="ic">🧭</span><b>营业执照办理指南</b></div><div class="g-body"><div class="g-sec"><h5>① 办理步骤</h5><ol><li>登录属地市场监督管理局网上办事大厅，提交名称核准申请</li><li>准备股东身份证明、经营场所证明、公司章程等材料</li><li>提交设立登记申请，等待审核</li><li>审核通过后领取营业执照（可在线下载电子执照）</li></ol></div><div class="g-sec"><h5>② 所需材料</h5><div class="mat-list"><span class="mat-chip">☑ 法定代表人身份证明</span><span class="mat-chip">☑ 经营场所证明</span><span class="mat-chip">☑ 公司章程</span><span class="mat-chip">☑ 股东会决议</span><span class="mat-chip">☑ 名称预先核准通知书</span></div></div><div class="g-sec"><h5>③ 办理信息</h5><div class="guide-meta"><span>📍 属地政务服务中心（市场监管窗口）</span><span>⏱ 预计 3 个工作日</span></div></div></div></div><div class="msg-actions" style="margin-top:10px"><span class="mini-btn" onclick="copyText(this)">📋 复制</span><span class="mini-btn">⭐ 收藏</span></div></div>';
    }else{
      html+='已收到您的问题，正在基于政务知识库检索…（演示原型）<cite onclick="toggleSrc(this)">1</cite><div class="src-pop" style="display:none"><div class="st">[1] 知识库匹配片段</div><div class="sb">…相关政策条文与<mark>匹配内容</mark>在此展示…</div></div><div class="msg-actions"><span class="mini-btn" onclick="copyText(this)">📋 复制</span><span class="mini-btn" onclick="regenerate(this)">🔄 重新生成</span></div>';
    }
    html+='</div></div>';
    return html;
  }

  function switchType(el){document.querySelectorAll('.doc-tab').forEach(function(t){t.classList.remove('active')});el.classList.add('active');document.getElementById('docResult').classList.remove('show');document.getElementById('docResult').innerHTML='';}
  function openDoc(){document.getElementById('docPanel').classList.add('open');}
  function closeDoc(){document.getElementById('docPanel').classList.remove('open');}
  function generateDoc(){
    var type=document.querySelector('.doc-tab.active').getAttribute('data-type');
    var t=document.getElementById('docTitle').value.trim();
    var body=document.getElementById('docBody').value.trim();
    var to=document.getElementById('docTo').value.trim();
    var sign=document.getElementById('docSign').value.trim();
    if(!t&&!body){document.getElementById('docResult').classList.add('show');document.getElementById('docResult').innerHTML='请至少填写标题或正文要点';return;}
    var title=t||('关于'+type+'的'+type);
    var r=document.getElementById('docResult');
    var out='<b>【'+type+'】</b><br>'+title+'<br><br>';
    if(to)out+=to+'：<br>';
    if(type==='通知'&&body)out+='　　定于 2026年8月25日（周二）上午9:00 在局机关三楼会议室召开'+type+'，请相关人员准时参加。<br><br>　　'+body+'<br><br>';
    else out+='　　'+body+'<br><br>';
    if(sign)out+=sign;else out+='　　（单位名称）<br>　　2026年8月22日';
    r.innerHTML=out;r.classList.add('show');
  }
</script>
